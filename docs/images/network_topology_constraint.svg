<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-bgp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
    <marker id="arrowhead-problem" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff0000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Network Design Constraint: Layer 2 Gateway in Layer 3 BGP Network
  </text>

  <!-- Problem Statement Box -->
  <rect x="50" y="60" width="1300" height="100" fill="#fff3cd" stroke="#ffc107" stroke-width="3" rx="8"/>
  <text x="700" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#856404">
    ⚠️ DESIGN CONSTRAINT IDENTIFIED
  </text>
  <text x="700" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#856404">
    Wireless Concentrator has BGP peering to ISP (WAN) and SRV (LAN) devices and requires Layer 3 routing.
  </text>
  <text x="700" y="138" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#856404">
    Meraki Campus Gateway is Layer 2 ONLY - Cannot participate in BGP routing!
  </text>

  <!-- ISP Router (WAN) - Left -->
  <rect x="150" y="200" width="180" height="80" fill="#ff6b6b" stroke="#c92a2a" stroke-width="3" rx="5"/>
  <text x="240" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    ISP Router
  </text>
  <text x="240" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (WAN)
  </text>
  <text x="240" y="270" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#ffe3e3">
    BGP Peer
  </text>

  <!-- SRV Devices (LAN) - Right -->
  <rect x="1070" y="200" width="180" height="80" fill="#51cf66" stroke="#2b8a3e" stroke-width="3" rx="5"/>
  <text x="1160" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    SRV Devices
  </text>
  <text x="1160" y="255" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (LAN)
  </text>
  <text x="1160" y="270" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#d3f9d8">
    BGP Peer
  </text>

  <!-- Wireless Concentrator (Center - Current BGP Router) -->
  <rect x="550" y="180" width="300" height="120" fill="#339af0" stroke="#1864ab" stroke-width="4" rx="5"/>
  <text x="700" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    Wireless Concentrator
  </text>
  <text x="700" y="245" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (Layer 3 Router)
  </text>
  <text x="700" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e7f5ff">
    ⚡ REQUIRES BGP ROUTING
  </text>
  <text x="700" y="283" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#e7f5ff">
    Currently peers with ISP + SRV
  </text>

  <!-- BGP Connections -->
  <line x1="330" y1="240" x2="550" y2="240" stroke="#0066cc" stroke-width="4" marker-end="url(#arrowhead-bgp)"/>
  <line x1="550" y1="240" x2="330" y2="240" stroke="#0066cc" stroke-width="4" marker-start="url(#arrowhead-bgp)"/>
  <text x="420" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0066cc">BGP</text>

  <line x1="850" y1="240" x2="1070" y2="240" stroke="#0066cc" stroke-width="4" marker-end="url(#arrowhead-bgp)"/>
  <line x1="1070" y1="240" x2="850" y2="240" stroke="#0066cc" stroke-width="4" marker-start="url(#arrowhead-bgp)"/>
  <text x="940" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0066cc">BGP</text>

  <!-- Problem Area Highlight -->
  <rect x="525" y="350" width="350" height="200" fill="#ffe0e0" stroke="#ff0000" stroke-width="4" stroke-dasharray="10,5" rx="8"/>
  <text x="700" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#cc0000">
    ❌ PROBLEM AREA
  </text>

  <!-- Meraki Campus Gateway -->
  <rect x="550" y="400" width="300" height="120" fill="#ffa94d" stroke="#e67700" stroke-width="3" rx="5"/>
  <text x="700" y="440" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    Meraki Campus Gateway
  </text>
  <text x="700" y="465" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (Layer 2 ONLY Device)
  </text>
  <text x="700" y="485" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
    ⚠️ NO BGP SUPPORT
  </text>
  <text x="700" y="503" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#fff3e0">
    Cannot route, only switches
  </text>

  <!-- Question Mark Connection -->
  <line x1="700" y1="300" x2="700" y2="400" stroke="#ff0000" stroke-width="4" stroke-dasharray="5,5" marker-end="url(#arrowhead-problem)"/>
  <text x="740" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ff0000">❓</text>
  <text x="820" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#cc0000">How to connect</text>
  <text x="820" y="362" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#cc0000">without Layer 3?</text>

  <!-- VXLAN Tunnels -->
  <text x="700" y="565" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9775fa">
    VXLAN Tunnels (Layer 2)
  </text>

  <!-- Access Points -->
  <rect x="200" y="620" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="290" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">AP1</text>

  <rect x="610" y="620" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="700" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">AP2</text>

  <rect x="1020" y="620" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="1110" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">AP3</text>

  <!-- VXLAN Connections -->
  <line x1="620" y1="520" x2="290" y2="620" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="520" x2="700" y2="620" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <line x1="780" y1="520" x2="1110" y2="620" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>

  <!-- Clients -->
  <ellipse cx="290" cy="780" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="290" y="790" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Clients</text>

  <ellipse cx="700" cy="780" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="700" y="790" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Clients</text>

  <ellipse cx="1110" cy="780" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="1110" y="790" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Clients</text>

  <!-- Client Connections -->
  <line x1="290" y1="700" x2="290" y2="730" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="700" y1="700" x2="700" y2="730" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1110" y1="700" x2="1110" y2="730" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Key Issues Box -->
  <rect x="50" y="840" width="600" height="140" fill="#f8d7da" stroke="#dc3545" stroke-width="3" rx="8"/>
  <text x="350" y="870" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#721c24">
    🔴 KEY ISSUES TO RESOLVE
  </text>
  <text x="70" y="895" font-family="Arial, sans-serif" font-size="13" fill="#721c24">
    1. Wireless Concentrator needs BGP routing (Layer 3)
  </text>
  <text x="70" y="915" font-family="Arial, sans-serif" font-size="13" fill="#721c24">
    2. Meraki Gateway only supports Layer 2 switching
  </text>
  <text x="70" y="935" font-family="Arial, sans-serif" font-size="13" fill="#721c24">
    3. Cannot establish BGP between L2 gateway and L3 devices
  </text>
  <text x="70" y="955" font-family="Arial, sans-serif" font-size="13" fill="#721c24">
    4. Need Layer 3 protocol configuration at gateway level
  </text>

  <!-- Discussion Needed Box -->
  <rect x="750" y="840" width="600" height="140" fill="#d1ecf1" stroke="#0c5460" stroke-width="3" rx="8"/>
  <text x="1050" y="870" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0c5460">
    💬 REQUIRES DISCUSSION
  </text>
  <text x="770" y="895" font-family="Arial, sans-serif" font-size="13" fill="#0c5460">
    ✓ How to integrate L2 gateway with existing BGP network?
  </text>
  <text x="770" y="915" font-family="Arial, sans-serif" font-size="13" fill="#0c5460">
    ✓ Can gateway work with upstream L3 core switch?
  </text>
  <text x="770" y="935" font-family="Arial, sans-serif" font-size="13" fill="#0c5460">
    ✓ Alternative routing architectures to consider?
  </text>
  <text x="770" y="955" font-family="Arial, sans-serif" font-size="13" fill="#0c5460">
    ✓ Gateway configuration options available?
  </text>

  <!-- Legend -->
  <rect x="1180" y="200" width="200" height="160" fill="#fff" stroke="#dee2e6" stroke-width="2" rx="5"/>
  <text x="1280" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Legend
  </text>

  <line x1="1200" y1="245" x2="1250" y2="245" stroke="#0066cc" stroke-width="4"/>
  <text x="1260" y="250" font-family="Arial, sans-serif" font-size="11" fill="#333">BGP (L3)</text>

  <line x1="1200" y1="270" x2="1250" y2="270" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="1260" y="275" font-family="Arial, sans-serif" font-size="11" fill="#333">VXLAN (L2)</text>

  <line x1="1200" y1="295" x2="1250" y2="295" stroke="#ff0000" stroke-width="4" stroke-dasharray="5,5"/>
  <text x="1260" y="300" font-family="Arial, sans-serif" font-size="11" fill="#333">Problem</text>

  <rect x="1200" y="310" width="20" height="20" fill="#339af0" stroke="#1864ab" stroke-width="2"/>
  <text x="1230" y="325" font-family="Arial, sans-serif" font-size="11" fill="#333">Layer 3</text>

  <rect x="1200" y="335" width="20" height="20" fill="#ffa94d" stroke="#e67700" stroke-width="2"/>
  <text x="1230" y="350" font-family="Arial, sans-serif" font-size="11" fill="#333">Layer 2</text>
</svg>
