<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-both" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Network Topology - BGP with Layer 2 Campus Gateway
  </text>

  <!-- ISP Router (WAN) -->
  <rect x="500" y="80" width="200" height="80" fill="#ff6b6b" stroke="#c92a2a" stroke-width="3" rx="5"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    ISP Router
  </text>
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (WAN)
  </text>

  <!-- BGP Peering Label -->
  <text x="600" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0066cc">
    BGP Peering
  </text>

  <!-- Connection: ISP to Core -->
  <line x1="600" y1="160" x2="600" y2="220" stroke="#0066cc" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Layer 3 Core Switch -->
  <rect x="450" y="220" width="300" height="100" fill="#339af0" stroke="#1864ab" stroke-width="3" rx="5"/>
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    Layer 3 Core Switch
  </text>
  <text x="600" y="285" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (Handles all routing)
  </text>
  <text x="600" y="305" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#e7f5ff">
    BGP Router
  </text>

  <!-- SRV Devices (Left) -->
  <rect x="100" y="240" width="200" height="80" fill="#51cf66" stroke="#2b8a3e" stroke-width="3" rx="5"/>
  <text x="200" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    SRV Devices
  </text>
  <text x="200" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (LAN)
  </text>

  <!-- Wireless Concentrator (Right) -->
  <rect x="900" y="240" width="200" height="80" fill="#51cf66" stroke="#2b8a3e" stroke-width="3" rx="5"/>
  <text x="1000" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    Wireless
  </text>
  <text x="1000" y="295" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    Concentrator
  </text>

  <!-- BGP Connections -->
  <line x1="300" y1="280" x2="450" y2="270" stroke="#0066cc" stroke-width="3" marker-start="url(#arrowhead-both)" marker-end="url(#arrowhead-both)"/>
  <text x="360" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0066cc">BGP</text>

  <line x1="750" y1="270" x2="900" y2="280" stroke="#0066cc" stroke-width="3" marker-start="url(#arrowhead-both)" marker-end="url(#arrowhead-both)"/>
  <text x="810" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0066cc">BGP</text>

  <!-- Layer 2 Port-Channel Label -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff6b00">
    Layer 2 Port-Channel
  </text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff6b00">
    (LACP)
  </text>

  <!-- Connection: Core to Gateway -->
  <line x1="600" y1="320" x2="600" y2="420" stroke="#ff6b00" stroke-width="4" marker-end="url(#arrowhead)"/>

  <!-- Meraki Campus Gateway -->
  <rect x="450" y="420" width="300" height="100" fill="#ffa94d" stroke="#e67700" stroke-width="3" rx="5"/>
  <text x="600" y="460" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    Meraki Campus Gateway
  </text>
  <text x="600" y="485" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (Layer 2 Device)
  </text>
  <text x="600" y="505" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#fff3e0">
    VXLAN Aggregation
  </text>

  <!-- VXLAN Tunnels Label -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9775fa">
    VXLAN Tunnels (Layer 2)
  </text>

  <!-- Access Points -->
  <!-- AP1 -->
  <rect x="150" y="620" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="240" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    AP1
  </text>
  <text x="240" y="675" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f3f0ff">
    Access Point
  </text>

  <!-- AP2 -->
  <rect x="510" y="620" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="600" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    AP2
  </text>
  <text x="600" y="675" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f3f0ff">
    Access Point
  </text>

  <!-- AP3 -->
  <rect x="870" y="620" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="960" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    AP3
  </text>
  <text x="960" y="675" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f3f0ff">
    Access Point
  </text>

  <!-- VXLAN Connections to APs -->
  <line x1="520" y1="520" x2="240" y2="620" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="520" x2="600" y2="620" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <line x1="680" y1="520" x2="960" y2="620" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>

  <!-- Clients -->
  <!-- Clients for AP1 -->
  <ellipse cx="240" cy="780" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="240" y="790" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Clients
  </text>

  <!-- Clients for AP2 -->
  <ellipse cx="600" cy="780" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="600" y="790" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Clients
  </text>

  <!-- Clients for AP3 -->
  <ellipse cx="960" cy="780" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="960" y="790" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Clients
  </text>

  <!-- Connections: APs to Clients -->
  <line x1="240" y1="700" x2="240" y2="730" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="700" x2="600" y2="730" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="960" y1="700" x2="960" y2="730" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="50" y="30" width="250" height="140" fill="#fff" stroke="#dee2e6" stroke-width="2" rx="5"/>
  <text x="175" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Legend
  </text>

  <line x1="70" y1="75" x2="120" y2="75" stroke="#0066cc" stroke-width="3"/>
  <text x="130" y="80" font-family="Arial, sans-serif" font-size="12" fill="#333">BGP (Layer 3)</text>

  <line x1="70" y1="100" x2="120" y2="100" stroke="#ff6b00" stroke-width="4"/>
  <text x="130" y="105" font-family="Arial, sans-serif" font-size="12" fill="#333">LACP (Layer 2)</text>

  <line x1="70" y1="125" x2="120" y2="125" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="130" y="130" font-family="Arial, sans-serif" font-size="12" fill="#333">VXLAN (Layer 2)</text>

  <line x1="70" y1="150" x2="120" y2="150" stroke="#333" stroke-width="2"/>
  <text x="130" y="155" font-family="Arial, sans-serif" font-size="12" fill="#333">Client Connection</text>
</svg>
