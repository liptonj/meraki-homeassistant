<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-bgp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0066cc" />
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2b8a3e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1200" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="800" y="40" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Proposed Solution: Layer 3 Core Switch + Layer 2 Meraki Campus Gateway
  </text>

  <!-- Solution Statement Box -->
  <rect x="50" y="60" width="1500" height="80" fill="#d4edda" stroke="#28a745" stroke-width="3" rx="8"/>
  <text x="800" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#155724">
    ✅ RECOMMENDED ARCHITECTURE
  </text>
  <text x="800" y="115" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#155724">
    Insert a Layer 3 Core Switch to handle all BGP routing. Meraki Gateway connects as Layer 2 device downstream.
  </text>

  <!-- ISP Router (WAN) - Top Center -->
  <rect x="650" y="180" width="200" height="80" fill="#ff6b6b" stroke="#c92a2a" stroke-width="3" rx="5"/>
  <text x="750" y="215" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    ISP Router
  </text>
  <text x="750" y="235" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (WAN)
  </text>
  <text x="750" y="250" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#ffe3e3">
    BGP Peer
  </text>

  <!-- BGP Label to Core -->
  <text x="750" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0066cc">
    BGP Peering
  </text>

  <!-- Connection ISP to Core -->
  <line x1="750" y1="260" x2="750" y2="330" stroke="#0066cc" stroke-width="4" marker-end="url(#arrowhead-bgp)"/>
  <line x1="750" y1="330" x2="750" y2="260" stroke="#0066cc" stroke-width="4" marker-start="url(#arrowhead-bgp)"/>

  <!-- Layer 3 Core Switch (NEW - Main Router) -->
  <g id="core-switch">
    <rect x="525" y="330" width="450" height="140" fill="#20c997" stroke="#087f5b" stroke-width="4" rx="8">
      <animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
      ⭐ NEW COMPONENT ⭐
    </text>
    <text x="750" y="395" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">
      Layer 3 Core Switch
    </text>
    <text x="750" y="420" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#fff">
      (BGP Router - Handles ALL routing)
    </text>
    <text x="750" y="445" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c3fae8">
      ✓ BGP to ISP, SRV, Wireless Concentrator
    </text>
    <text x="750" y="460" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#c3fae8">
      Becomes central routing point
    </text>
  </g>

  <!-- SRV Devices (Left) -->
  <rect x="100" y="360" width="200" height="80" fill="#339af0" stroke="#1864ab" stroke-width="3" rx="5"/>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    SRV Devices
  </text>
  <text x="200" y="415" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (LAN)
  </text>
  <text x="200" y="430" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#d0ebff">
    BGP Peer
  </text>

  <!-- Wireless Concentrator (Right) -->
  <rect x="1200" y="360" width="250" height="80" fill="#339af0" stroke="#1864ab" stroke-width="3" rx="5"/>
  <text x="1325" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    Wireless Concentrator
  </text>
  <text x="1325" y="410" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (Layer 3)
  </text>
  <text x="1325" y="425" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#d0ebff">
    BGP Peer
  </text>

  <!-- BGP Connections to Core -->
  <line x1="300" y1="400" x2="525" y2="400" stroke="#0066cc" stroke-width="4" marker-end="url(#arrowhead-bgp)"/>
  <line x1="525" y1="400" x2="300" y2="400" stroke="#0066cc" stroke-width="4" marker-start="url(#arrowhead-bgp)"/>
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0066cc">BGP</text>

  <line x1="975" y1="400" x2="1200" y2="400" stroke="#0066cc" stroke-width="4" marker-end="url(#arrowhead-bgp)"/>
  <line x1="1200" y1="400" x2="975" y2="400" stroke="#0066cc" stroke-width="4" marker-start="url(#arrowhead-bgp)"/>
  <text x="1070" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0066cc">BGP</text>

  <!-- Layer 2 Connection Label -->
  <text x="750" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff6b00">
    Layer 2 Port-Channel (LACP)
  </text>
  <text x="750" y="530" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ff6b00">
    No BGP required here - pure switching
  </text>

  <!-- Connection Core to Gateway -->
  <line x1="750" y1="470" x2="750" y2="560" stroke="#ff6b00" stroke-width="5" marker-end="url(#arrowhead)"/>

  <!-- Meraki Campus Gateway -->
  <rect x="575" y="560" width="350" height="120" fill="#ffa94d" stroke="#e67700" stroke-width="3" rx="5"/>
  <text x="750" y="600" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#fff">
    Meraki Campus Gateway
  </text>
  <text x="750" y="625" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#fff">
    (Layer 2 ONLY Device)
  </text>
  <text x="750" y="645" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
    ✓ Works as L2 switch/aggregator
  </text>
  <text x="750" y="663" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#fff3e0">
    VXLAN to APs, no routing needed
  </text>

  <!-- VXLAN Label -->
  <text x="750" y="715" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#9775fa">
    VXLAN Tunnels (Layer 2 over IP)
  </text>

  <!-- Access Points -->
  <rect x="200" y="770" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="290" y="805" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">AP1</text>
  <text x="290" y="825" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f3f0ff">Access Point</text>

  <rect x="660" y="770" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="750" y="805" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">AP2</text>
  <text x="750" y="825" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f3f0ff">Access Point</text>

  <rect x="1120" y="770" width="180" height="80" fill="#9775fa" stroke="#6741d9" stroke-width="3" rx="5"/>
  <text x="1210" y="805" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">AP3</text>
  <text x="1210" y="825" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f3f0ff">Access Point</text>

  <!-- VXLAN Connections -->
  <line x1="670" y1="680" x2="290" y2="770" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="680" x2="750" y2="770" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
  <line x1="830" y1="680" x2="1210" y2="770" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>

  <!-- Clients -->
  <ellipse cx="290" cy="930" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="290" y="940" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Clients</text>

  <ellipse cx="750" cy="930" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="750" y="940" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Clients</text>

  <ellipse cx="1210" cy="930" rx="100" ry="50" fill="#ffe066" stroke="#fab005" stroke-width="2"/>
  <text x="1210" y="940" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Clients</text>

  <!-- Client Connections -->
  <line x1="290" y1="850" x2="290" y2="880" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="750" y1="850" x2="750" y2="880" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1210" y1="850" x2="1210" y2="880" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Benefits Box -->
  <rect x="50" y="1010" width="720" height="170" fill="#d4edda" stroke="#28a745" stroke-width="3" rx="8"/>
  <text x="410" y="1040" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#155724">
    ✅ SOLUTION BENEFITS
  </text>
  <text x="70" y="1065" font-family="Arial, sans-serif" font-size="13" fill="#155724">
    ✓ Core Switch handles ALL BGP routing (ISP, SRV, Wireless Concentrator)
  </text>
  <text x="70" y="1090" font-family="Arial, sans-serif" font-size="13" fill="#155724">
    ✓ Meraki Gateway operates purely at Layer 2 (its designed capability)
  </text>
  <text x="70" y="1115" font-family="Arial, sans-serif" font-size="13" fill="#155724">
    ✓ No Layer 3 protocol required on gateway - just LACP/port-channel
  </text>
  <text x="70" y="1140" font-family="Arial, sans-serif" font-size="13" fill="#155724">
    ✓ Clear separation: Core = Routing, Gateway = Switching + VXLAN
  </text>
  <text x="70" y="1165" font-family="Arial, sans-serif" font-size="13" fill="#155724">
    ✓ Maintains existing BGP relationships through core switch
  </text>

  <!-- Alternative Solutions Box -->
  <rect x="830" y="1010" width="720" height="170" fill="#cce5ff" stroke="#004085" stroke-width="3" rx="8"/>
  <text x="1190" y="1040" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#004085">
    🔄 ALTERNATIVE SOLUTIONS TO DISCUSS
  </text>
  <text x="850" y="1065" font-family="Arial, sans-serif" font-size="13" fill="#004085">
    Option A: Use Meraki MX appliance (Layer 3) instead of Campus Gateway
  </text>
  <text x="850" y="1090" font-family="Arial, sans-serif" font-size="13" fill="#004085">
    Option B: Run BGP on upstream device, use static routes to gateway
  </text>
  <text x="850" y="1115" font-family="Arial, sans-serif" font-size="13" fill="#004085">
    Option C: Deploy SD-WAN with MPLS if multi-site is required
  </text>
  <text x="850" y="1140" font-family="Arial, sans-serif" font-size="13" fill="#004085">
    Option D: Verify if gateway supports any L3 features via licensing
  </text>
  <text x="850" y="1165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#004085">
    ⚠️ Requires detailed technical discussion to select best option
  </text>

  <!-- Legend -->
  <rect x="1380" y="180" width="200" height="200" fill="#fff" stroke="#dee2e6" stroke-width="2" rx="5"/>
  <text x="1480" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">
    Legend
  </text>

  <line x1="1400" y1="225" x2="1450" y2="225" stroke="#0066cc" stroke-width="4"/>
  <text x="1460" y="230" font-family="Arial, sans-serif" font-size="11" fill="#333">BGP (L3)</text>

  <line x1="1400" y1="250" x2="1450" y2="250" stroke="#ff6b00" stroke-width="5"/>
  <text x="1460" y="255" font-family="Arial, sans-serif" font-size="11" fill="#333">LACP (L2)</text>

  <line x1="1400" y1="275" x2="1450" y2="275" stroke="#9775fa" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="1460" y="280" font-family="Arial, sans-serif" font-size="11" fill="#333">VXLAN (L2)</text>

  <rect x="1400" y="295" width="25" height="20" fill="#20c997" stroke="#087f5b" stroke-width="2"/>
  <text x="1435" y="310" font-family="Arial, sans-serif" font-size="11" fill="#333">New L3 Core</text>

  <rect x="1400" y="325" width="25" height="20" fill="#339af0" stroke="#1864ab" stroke-width="2"/>
  <text x="1435" y="340" font-family="Arial, sans-serif" font-size="11" fill="#333">L3 BGP Peer</text>

  <rect x="1400" y="355" width="25" height="20" fill="#ffa94d" stroke="#e67700" stroke-width="2"/>
  <text x="1435" y="370" font-family="Arial, sans-serif" font-size="11" fill="#333">L2 Gateway</text>
</svg>
