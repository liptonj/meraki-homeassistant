name: Merge Conflict Resolver

run-name: 'Resolve conflicts on PR #${{ github.event.pull_request.number }}'

# Automatically resolves merge conflicts by merging beta into the PR branch
# Only handles simple conflicts that can be auto-resolved
# For complex conflicts, it comments on the PR asking for manual intervention

on:
  # Run when a PR becomes unmergeable
  pull_request_target:
    types: [opened, synchronize]
    branches: [beta]

  # Also run periodically to catch PRs that became conflicted
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours

  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix conflicts for (leave empty to check all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conflict-resolver-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check-and-resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Find PRs with conflicts
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            # Single PR from event
            PR_NUMBER="${{ github.event.pull_request.number }}"
            echo "prs=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.pr_number }}" ]]; then
            # Manual trigger with specific PR
            echo "prs=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            # Scheduled run - find all PRs with conflicts
            CONFLICTED_PRS=$(gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --base beta \
              --json number,mergeable \
              --jq '[.[] | select(.mergeable == "CONFLICTING")] | .[].number' | tr '\n' ' ')
            echo "Found PRs with conflicts: $CONFLICTED_PRS"
            echo "prs=$CONFLICTED_PRS" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve conflicts for each PR
        if: steps.find.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          for PR_NUMBER in ${{ steps.find.outputs.prs }}; do
            echo "=== Processing PR #$PR_NUMBER ==="

            # Get PR details
            PR_JSON=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json headRefName,mergeable,author \
              2>/dev/null || echo "{}")

            HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName // empty')
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable // empty')
            AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login // empty')

            if [[ -z "$HEAD_BRANCH" ]]; then
              echo "Could not get branch for PR #$PR_NUMBER - skipping"
              continue
            fi

            echo "Branch: $HEAD_BRANCH, Mergeable: $MERGEABLE"

            # Skip if already mergeable
            if [[ "$MERGEABLE" == "MERGEABLE" ]]; then
              echo "PR #$PR_NUMBER is already mergeable - skipping"
              continue
            fi

            # Try to resolve by merging beta
            echo "Attempting to merge beta into $HEAD_BRANCH..."

            git fetch origin beta "$HEAD_BRANCH"
            git checkout "$HEAD_BRANCH"

            # Try automatic merge
            if git merge origin/beta --no-edit -m "chore: merge beta to resolve conflicts"; then
              echo "✅ Auto-merge successful!"

              # Push the resolved branch
              git push origin "$HEAD_BRANCH"

              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "## ✅ Merge Conflicts Resolved

              Automatically merged \`beta\` into this branch to resolve conflicts.

              CI will now run on the updated code.

              ---
              *Auto-resolved by Merge Conflict Resolver*"

            else
              echo "❌ Auto-merge failed - conflicts require manual resolution"

              # Abort the failed merge
              git merge --abort 2>/dev/null || true

              # Comment on PR asking for manual help
              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "## ⚠️ Merge Conflicts Detected

              This PR has conflicts with \`beta\` that cannot be automatically resolved.

              **To fix manually:**
              \`\`\`bash
              git checkout $HEAD_BRANCH
              git fetch origin beta
              git merge origin/beta
              # Resolve conflicts in your editor
              git add .
              git commit
              git push
              \`\`\`

              ---
              *Detected by Merge Conflict Resolver*"
            fi

            # Reset for next PR
            git checkout beta 2>/dev/null || true
          done
