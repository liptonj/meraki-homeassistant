name: Merge Conflict Resolver

run-name: 'Resolve merge conflicts for open PRs'

# Automatically resolves merge conflicts by merging beta into the PR branch
# Only handles simple conflicts that can be auto-resolved
# For complex conflicts, it comments on the PR asking for manual intervention

on:
  # Run when beta is updated (this is when PRs become conflicted)
  push:
    branches: [beta]

  # Run periodically to catch any missed conflicts
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours

  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix conflicts for (leave empty to check all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conflict-resolver-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check-and-resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Wait for GitHub to calculate mergeable status
        if: github.event_name == 'push'
        run: |
          echo "Waiting 30 seconds for GitHub to calculate mergeable status..."
          sleep 30

      - name: Find PRs with conflicts
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ github.event.inputs.pr_number }}" ]]; then
            # Manual trigger with specific PR
            echo "prs=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            # Find all PRs with conflicts (or UNKNOWN status which may be conflicting)
            echo "Checking all open PRs targeting beta..."
            ALL_PRS=$(gh pr list \
              --repo "${{ github.repository }}" \
              --state open \
              --base beta \
              --json number,mergeable,title)
            echo "All PRs: $ALL_PRS"

            CONFLICTED_PRS=$(echo "$ALL_PRS" | jq -r '[.[] | select(.mergeable == "CONFLICTING" or .mergeable == "UNKNOWN")] | .[].number' | tr '\n' ' ')
            echo "Found PRs with conflicts or unknown status: $CONFLICTED_PRS"
            echo "prs=$CONFLICTED_PRS" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve conflicts for each PR
        if: steps.find.outputs.prs != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          for PR_NUMBER in ${{ steps.find.outputs.prs }}; do
            echo "=== Processing PR #$PR_NUMBER ==="

            # Get PR details
            PR_JSON=$(gh pr view "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --json headRefName,mergeable,author \
              2>/dev/null || echo "{}")

            HEAD_BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName // empty')
            MERGEABLE=$(echo "$PR_JSON" | jq -r '.mergeable // empty')
            AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login // empty')

            if [[ -z "$HEAD_BRANCH" ]]; then
              echo "Could not get branch for PR #$PR_NUMBER - skipping"
              continue
            fi

            echo "Branch: $HEAD_BRANCH, Mergeable: $MERGEABLE"

            # Skip if already mergeable
            if [[ "$MERGEABLE" == "MERGEABLE" ]]; then
              echo "PR #$PR_NUMBER is already mergeable - skipping"
              continue
            fi

            # Try to resolve by merging beta
            echo "Attempting to merge beta into $HEAD_BRANCH..."

            git fetch origin beta "$HEAD_BRANCH"
            git checkout "$HEAD_BRANCH"

            # Try automatic merge
            if git merge origin/beta --no-edit -m "chore: merge beta to resolve conflicts"; then
              echo "✅ Auto-merge successful!"

              # Push the resolved branch
              git push origin "$HEAD_BRANCH"

              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "## ✅ Merge Conflicts Resolved

              Automatically merged \`beta\` into this branch to resolve conflicts.

              CI will now run on the updated code.

              ---
              *Auto-resolved by Merge Conflict Resolver*"

            else
              echo "❌ Auto-merge failed - invoking Cursor to resolve"

              # Abort the failed merge
              git merge --abort 2>/dev/null || true

              # Get conflicting files for context
              git fetch origin beta "$HEAD_BRANCH"
              git checkout "$HEAD_BRANCH"
              CONFLICT_FILES=$(git merge origin/beta 2>&1 | grep "CONFLICT" | sed 's/.*in //' || echo "unknown files")
              git merge --abort 2>/dev/null || true

              # Store PR number for Cursor invocation
              echo "$PR_NUMBER" >> /tmp/conflict_prs.txt
              echo "$HEAD_BRANCH" >> /tmp/conflict_branches.txt
              echo "$CONFLICT_FILES" >> /tmp/conflict_files.txt
            fi

            # Reset for next PR
            git checkout beta 2>/dev/null || true
          done

      - name: Invoke Cursor to resolve complex conflicts
        if: steps.find.outputs.prs != ''
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [[ ! -f /tmp/conflict_prs.txt ]]; then
            echo "No complex conflicts to resolve"
            exit 0
          fi

          # Read all PRs that need Cursor help
          while IFS= read -r PR_NUMBER && IFS= read -r HEAD_BRANCH <&3 && IFS= read -r CONFLICT_FILES <&4; do
            echo "=== Invoking Cursor for PR #$PR_NUMBER ==="

            # Comment on PR
            gh pr comment "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --body "## 🤖 Invoking Cursor to Resolve Merge Conflicts

          This PR has conflicts with \`beta\` that require intelligent resolution.

          **Conflicting files:** $CONFLICT_FILES

          Cursor will analyze the conflicts and create a fix.

          ---
          *Initiated by Merge Conflict Resolver*"

            # Build Cursor prompt
            PROMPT="You are resolving merge conflicts for PR #$PR_NUMBER on branch $HEAD_BRANCH.

          ## Task
          Resolve the merge conflicts between this branch and the beta branch WITHOUT breaking any functionality.

          ## Instructions
          1. First, fetch the latest: git fetch origin beta $HEAD_BRANCH
          2. Check out the branch: git checkout $HEAD_BRANCH
          3. Merge origin/beta: git merge origin/beta
          4. For each conflict:
             - Understand both versions
             - Combine changes intelligently (keep ALL features from both sides)
             - Prefer beta's structure/formatting when in doubt
             - NEVER delete functionality from either side
          5. Run ./run_checks.sh to verify nothing is broken
          6. Commit and push the resolution: git add . && git commit -m 'fix: resolve merge conflicts with beta' && git push

          ## Conflicting Files
          $CONFLICT_FILES

          ## Critical Rules
          - Do NOT remove any imports, functions, or features
          - Combine both versions when possible
          - Test that the code compiles/lints after resolution
          - If you can't resolve safely, comment on the PR explaining why

          ## GitHub Access
          Use GH_PAT environment variable for any GitHub operations if needed."

            # Escape prompt for JSON
            ESCAPED_PROMPT=$(echo "$PROMPT" | jq -Rs .)

            # Invoke Cursor API with correct format
            RESPONSE=$(curl -sS -X POST "https://api.cursor.com/v0/agents" \
              -u "${CURSOR_API_KEY}:" \
              -H "Content-Type: application/json" \
              -d "{
                \"source\": {
                  \"repository\": \"https://github.com/${{ github.repository }}\",
                  \"ref\": \"$HEAD_BRANCH\"
                },
                \"prompt\": {
                  \"text\": ${ESCAPED_PROMPT}
                },
                \"target\": {
                  \"branchName\": \"$HEAD_BRANCH\",
                  \"autoCreatePr\": false
                }
              }") || true

            echo "Cursor API response: $RESPONSE"

            # Check if successful
            if echo "$RESPONSE" | grep -q '"id"'; then
              AGENT_ID=$(echo "$RESPONSE" | jq -r '.id // empty')
              echo "✅ Cursor agent launched: $AGENT_ID"

              gh pr comment "$PR_NUMBER" \
                --repo "${{ github.repository }}" \
                --body "🚀 Cursor agent launched to resolve conflicts. Agent ID: \`$AGENT_ID\`"
            else
              echo "⚠️ Cursor API call may have failed: $RESPONSE"
            fi

          done < /tmp/conflict_prs.txt 3< /tmp/conflict_branches.txt 4< /tmp/conflict_files.txt
