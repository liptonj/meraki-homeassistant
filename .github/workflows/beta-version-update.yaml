name: Beta Version Update

on:
  pull_request:
    types: [closed]
    branches:
      - beta
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm beta version bump'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# IMPORTANT: Repository settings must also allow workflow permissions
# Go to: Settings → Actions → General → Workflow permissions
# Select: "Read and write permissions"
permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  # Clean up the merged branch
  cleanup-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    # Inherits permissions from workflow level
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          # Don't delete protected branches
          if [[ "$BRANCH" == "main" || "$BRANCH" == "beta" ]]; then
            echo "Skipping deletion of protected branch: $BRANCH"
            exit 0
          fi

          echo "Deleting merged branch: $BRANCH"
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || true
          echo "✅ Branch $BRANCH deleted"

      - name: Update linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Extract issue number (PR_BODY is in env to avoid shell injection)
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' | head -1)

          if [[ -n "$ISSUE_NUM" ]]; then
            echo "Updating issue #$ISSUE_NUM with merge notification"

            gh issue comment $ISSUE_NUM \
              --repo "${{ github.repository }}" \
              --body "## 🎉 Merged to Beta!

            **PR #${{ github.event.pull_request.number }}** has been merged.

            **Branch:** \`${{ github.event.pull_request.head.ref }}\` → deleted ✅
            **Merged by:** @${{ github.event.pull_request.merged_by.login }}

            This issue will be automatically closed.

            ---
            *A new beta release will be created shortly.*"

            # Update labels
            gh issue edit $ISSUE_NUM \
              --repo "${{ github.repository }}" \
              --remove-label "pr-pending" \
              --remove-label "ready-for-review" \
              --remove-label "cursor-reviewed" \
              --remove-label "cursor-reviewing" \
              --remove-label "cursor-working" \
              --remove-label "in-progress" \
              --add-label "released-beta" 2>/dev/null || true

            # Close the issue (GitHub only auto-closes on merge to default branch)
            gh issue close $ISSUE_NUM \
              --repo "${{ github.repository }}" \
              --reason completed \
              --comment "Closed automatically after merge to beta."
          fi

  version:
    runs-on: ubuntu-latest
    # Note: cleanup-branch runs in parallel, not as a dependency
    # This ensures job outputs propagate correctly to downstream jobs
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'true') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    # Inherits permissions from workflow level
    outputs:
      new_version: ${{ steps.increment.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'beta'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: uv pip install --system bump2version playwright

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(uv pip show playwright --system | grep Version | cut -d' ' -f2)
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: custom_components/meraki_ha/www/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('custom_components/meraki_ha/www/package-lock.json') }}

      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix custom_components/meraki_ha/www

      - name: Increment Version
        id: increment
        run: |
          bump2version --allow-dirty beta
          new_version=$(grep -oP '"version": "\K[^"]+' custom_components/meraki_ha/manifest.json)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        if: steps.increment.outputs.new_version != ''
        run: |
          echo "Synchronizing package.json version to: ${{ steps.increment.outputs.new_version }}"
          npm version ${{ steps.increment.outputs.new_version }} --no-git-tag-version --allow-same-version --prefix custom_components/meraki_ha/www

      - name: Build frontend
        if: steps.increment.outputs.new_version != ''
        run: |
          npm run build --prefix custom_components/meraki_ha/www

      - name: Generate Screenshots
        if: steps.increment.outputs.new_version != ''
        id: generate-screenshots
        continue-on-error: true
        run: |
          python scripts/generate_screenshots.py

      - name: Log screenshot generation result
        if: steps.generate-screenshots.outcome == 'failure'
        run: |
          echo "::warning::Screenshot generation failed or was incomplete. Some screenshots may not have been updated."
          echo "This is non-blocking - the release will continue."

      - name: Commit and push changes
        if: steps.increment.outputs.new_version != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(release): update version to ${{ steps.increment.outputs.new_version }} [skip ci]'
          file_pattern: 'custom_components/meraki_ha/manifest.json CHANGELOG.md .bumpversion.cfg custom_components/meraki_ha/www/package.json custom_components/meraki_ha/www/package-lock.json custom_components/meraki_ha/www/meraki-panel.js docs/images/*.png'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
          branch: 'beta'

  release:
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.new_version != ''
    # Inherits permissions from workflow level
    steps:
      # Fresh checkout gets the just-pushed commit with version bump
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: 'beta'

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --target beta is REQUIRED to ensure the release is created from
          # the just-pushed commit, not from GitHub's cached branch state
          gh release create "v${{ needs.version.outputs.new_version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.version.outputs.new_version }}" \
            --generate-notes \
            --prerelease \
            --target beta

  deploy:
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.new_version != '' && vars.ENABLE_HACS_DEPLOY == 'true'
    timeout-minutes: 20
    concurrency:
      group: home-assistant-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: astral-sh/setup-uv@v4
      - name: Deploy and verify Meraki integration
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          NEW_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          sleep 30
          uv run --no-project --with aiohttp==3.14.3 scripts/deploy_homeassistant.py --meraki-version "$NEW_VERSION"
