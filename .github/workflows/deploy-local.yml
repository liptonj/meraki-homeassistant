name: Deploy via HACS

on:
  push:
    branches: [codex/meraki-sdk-secrets]
    paths:
      [scripts/deploy_homeassistant.py, .github/workflows/deploy-local.yml]
  workflow_dispatch:
    inputs:
      inspect:
        description: Inspect deployed versions without changing them
        type: boolean
        default: true
      meraki_version:
        description: Exact published Meraki version to deploy (blank skips it)
        type: string
        default: ''
      step_ca_version:
        description: Exact Step CA version to deploy (blank skips it)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: home-assistant-deployment
  cancel-in-progress: false

jobs:
  deploy-via-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: vars.ENABLE_HACS_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Inspect or deploy exact versions
        env:
          HA_URL: ${{ secrets.HA_URL }}
          HA_TOKEN: ${{ secrets.HA_TOKEN }}
          INSPECT: ${{ inputs.inspect || github.event_name == 'push' }}
          MERAKI_VERSION: ${{ inputs.meraki_version }}
          STEP_CA_VERSION: ${{ inputs.step_ca_version }}
        run: |
          args=()
          if [[ "$INSPECT" == 'true' ]]; then args+=(--inspect); fi
          if [[ -n "$MERAKI_VERSION" ]]; then args+=(--meraki-version "$MERAKI_VERSION"); fi
          if [[ -n "$STEP_CA_VERSION" ]]; then args+=(--step-ca-version "$STEP_CA_VERSION"); fi
          uv run --no-project --with aiohttp==3.14.3 scripts/deploy_homeassistant.py "${args[@]}"
