# Meraki Dashboard - 3 Column Layout (Flexible Width)
# Your config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
#
# This version uses 3 columns for more flexible card sizing

title: Meraki Network
icon: mdi:router-network

views:
  # ============================================================================
  # OVERVIEW VIEW - 3 Column Layout for Flexible Widths
  # ============================================================================
  - title: Overview
    path: overview
    icon: mdi:view-dashboard
    type: masonry
    max_cols: 3 # 3 columns = 33%, 66%, or 100% widths

    badges:
      - type: custom:meraki-status-badge
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
      - type: custom:meraki-clients-badge
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
      - type: custom:meraki-alerts-badge
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN

    cards:
      # Main overview - Full width (100%)
      - type: custom:meraki-overview-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        view_layout:
          grid-column: span 3 # Spans all 3 columns = full width

      # Clients - 2/3 width (66%) - More space for the table
      - type: custom:meraki-clients-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        limit: 10
        view_layout:
          grid-column: span 2 # Spans 2 of 3 columns

      # SSIDs - 1/3 width (33%) - Compact sidebar
      - type: custom:meraki-ssids-list-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        view_layout:
          grid-column: span 1 # Spans 1 of 3 columns

  # ============================================================================
  # DEVICES VIEW
  # ============================================================================
  - title: Devices
    path: devices
    icon: mdi:devices
    cards:
      - type: custom:meraki-devices-by-type-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        title: Meraki Devices
        show_switches: true
        show_wireless: true
        show_cameras: true
        show_sensors: true
        show_appliances: true
        devices_per_page: 10

  # ============================================================================
  # CLIENTS VIEW
  # ============================================================================
  - title: Clients
    path: clients
    icon: mdi:account-multiple
    cards:
      - type: custom:meraki-clients-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        title: Network Clients
        limit: 50
        show_offline: false

  # ============================================================================
  # EVENTS VIEW
  # ============================================================================
  - title: Events
    path: events
    icon: mdi:history
    cards:
      - type: custom:meraki-events-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        events_per_page: 10

  # ============================================================================
  # GUEST ACCESS VIEW
  # ============================================================================
  - title: Guest Access
    path: guest
    icon: mdi:account-key
    cards:
      - type: custom:meraki-guest-access-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN

  # ============================================================================
  # SETTINGS VIEW
  # ============================================================================
  - title: Settings
    path: settings
    icon: mdi:cog
    cards:
      - type: custom:meraki-mqtt-status-card
        config_entry_id: 01KEWXQN207AMKWPF72B4R62CN
        title: MQTT Integration
        show_relay_destinations: true
        show_message_stats: true
        show_sensor_count: true
        collapsible: true
        default_collapsed: false
# ============================================================================
# CUSTOMIZATION GUIDE
# ============================================================================
#
# To change card widths, modify the `grid-column: span X` value:
#
# In a 3-column layout:
# - span 1 = 33% width  (1/3)
# - span 2 = 66% width  (2/3)
# - span 3 = 100% width (full width)
#
# Examples:
#
# Make Clients smaller (50% instead of 66%):
#   Change max_cols to 2, then use span 1
#
# Make SSIDs bigger (50% instead of 33%):
#   Change both to span 1 with max_cols: 2
#
# Add a third card in the row:
#   - type: custom:meraki-events-card
#     view_layout:
#       grid-column: span 1  # Will fit in the 3rd column
#
# Make everything equal width (33% each):
#   All cards use span 1 with max_cols: 3
#
# ============================================================================
